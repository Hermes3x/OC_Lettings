# Read the Docs configuration: how to build the Sphinx documentation online.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"

sphinx:
  configuration: docs/conf.py
  # A warning stops the build: the online documentation stays the previous version.
  fail_on_warning: true

# Django to read the docstrings, then Sphinx and its theme to build the pages.
python:
  install:
    - requirements: requirements.txt
    - requirements: docs/requirements.txt
